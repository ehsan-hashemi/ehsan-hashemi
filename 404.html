<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>404</title>
  <meta name="color-scheme" content="dark" />
  <style>
    :root {
      --bg: #0a0e17;
      --fg: #cfe7ff;
      --accent: #3aa8ff;
      --accent-2: #7c4dff;
      --accent-3: #00ffd5;
      --button-bg: #0f1524;
      --button-border: #2b3b64;
      --button-glow: rgba(58, 168, 255, 0.6);
    }

    /* Reset and base */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    /* Background stack: tech grid + animated glow + particles canvas */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle diagonal tech grid */
    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1200px 600px at 80% 10%, rgba(122, 77, 255, 0.12), transparent 60%),
        radial-gradient(1000px 1000px at 10% 90%, rgba(0, 255, 213, 0.10), transparent 60%),
        linear-gradient(135deg, rgba(58,168,255,0.08) 0%, rgba(0,0,0,0) 25%, rgba(58,168,255,0.08) 50%, rgba(0,0,0,0) 75%, rgba(58,168,255,0.08) 100%);
      background-size:
        auto,
        auto,
        8px 8px;
      filter: saturate(120%);
      mix-blend-mode: screen;
    }

    /* Animated neon blobs for motion */
    .bg::after {
      content: "";
      position: absolute;
      inset: -20vmax;
      background:
        radial-gradient(30vmax 30vmax at 20% 30%, rgba(58,168,255,0.14), transparent 65%),
        radial-gradient(25vmax 25vmax at 80% 70%, rgba(124,77,255,0.16), transparent 65%),
        radial-gradient(35vmax 35vmax at 50% 50%, rgba(0,255,213,0.10), transparent 70%);
      animation: float 18s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }

    @keyframes float {
      0%   { transform: translate3d(0, 0, 0) scale(1); filter: hue-rotate(0deg); }
      100% { transform: translate3d(3vmax, -2vmax, 0) scale(1.04); filter: hue-rotate(12deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg::after { animation: none; }
    }

    /* Particle canvas */
    canvas.particles {
      position: absolute;
      inset: 0;
      opacity: 0.6;
      filter: drop-shadow(0 0 0.25rem rgba(58,168,255,0.35));
    }

    /* Layout */
    main {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 6vh 4vw;
    }

    .card {
      display: grid;
      gap: 2.2rem;
      align-items: center;
      justify-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
      border: 1px solid rgba(110, 145, 200, 0.18);
      box-shadow:
        0 1px 12px rgba(20, 40, 80, 0.35),
        inset 0 0 32px rgba(58,168,255,0.08);
      backdrop-filter: blur(10px) saturate(120%);
      border-radius: 18px;
      padding: clamp(1.2rem, 2.5vw, 2rem);
      max-width: min(900px, 92vw);
    }

    .hero-img {
      display: block;
      width: 100%;
      height: auto;
      max-height: min(70vh, 700px);
      object-fit: contain;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.55))
              drop-shadow(0 0 20px rgba(58,168,255,0.18));
      user-select: none;
    }

    .actions {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .btn {
      --pad-x: clamp(1rem, 2.6vw, 1.4rem);
      --pad-y: clamp(0.7rem, 1.8vw, 0.9rem);
      appearance: none;
      border: 1px solid var(--button-border);
      color: var(--fg);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        radial-gradient(80% 120% at 50% 10%, rgba(58,168,255,0.20), transparent 60%);
      border-radius: 12px;
      padding: var(--pad-y) var(--pad-x);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      position: relative;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      box-shadow:
        0 0 0 0 rgba(58,168,255,0),
        inset 0 0 0 0 rgba(58,168,255,0.12);
      outline: none;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(from 180deg at 50% 50%, rgba(58,168,255,0.0), rgba(58,168,255,0.45), rgba(124,77,255,0.45), rgba(0,255,213,0.35), rgba(58,168,255,0.0));
      filter: blur(14px);
      opacity: 0.0;
      transition: opacity 180ms ease;
      z-index: -1;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: color-mix(in oklab, var(--button-border) 45%, var(--accent));
      box-shadow: 0 0 0 6px var(--button-glow);
    }

    .btn:hover::after { opacity: 0.8; }

    .btn:focus-visible {
      box-shadow: 0 0 0 6px var(--button-glow);
    }

    footer {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 1rem 2vw 1.4rem;
      color: rgba(207, 231, 255, 0.75);
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }

    /* Safe area for iOS */
    @supports (padding: env(safe-area-inset-bottom)) {
      footer { padding-bottom: calc(1.4rem + env(safe-area-inset-bottom)); }
      main { padding-bottom: calc(6vh + env(safe-area-inset-bottom)); }
    }

    /* Narrow screens: tighten card, keep image prominent */
    @media (max-width: 520px) {
      .card {
        gap: 1.5rem;
        padding: 1rem;
      }
      .hero-img {
        max-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <!-- Animated technological background -->
  <div class="bg" aria-hidden="true">
    <canvas class="particles"></canvas>
  </div>

  <main>
    <section class="card" aria-label="404">
      <!-- Replace src with your actual image path -->
      <img
        class="hero-img"
        src="/404.png"
        alt=""
        draggable="false"
        decoding="async"
      />
      <div class="actions">
        <a class="btn" href="/" aria-label="Return to home">بازگشت به صفحه اصلی</a>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 - ehsanpg.ir
  </footer>

  <script>
    // Minimal performant particle network for a tech vibe.
    (function () {
      const canvas = document.querySelector("canvas.particles");
      const ctx = canvas.getContext("2d", { alpha: true });
      let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      let width = 0, height = 0;

      const config = {
        count: 68,
        baseSpeed: 0.25,
        linkDist: 120,
        linkAlpha: 0.12,
        nodeSize: 1.4
      };

      const nodes = [];

      function resize() {
        width = canvas.width = Math.floor(window.innerWidth * dpr);
        height = canvas.height = Math.floor((window.innerHeight) * dpr);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }

      function rand(min, max) { return Math.random() * (max - min) + min; }

      function init() {
        nodes.length = 0;
        const densityScale = Math.min(1.2, Math.max(0.7, Math.sqrt((window.innerWidth * window.innerHeight) / (900 * 1600))));
        const count = Math.floor(config.count * densityScale);
        for (let i = 0; i < count; i++) {
          nodes.push({
            x: rand(0, width),
            y: rand(0, height),
            vx: rand(-config.baseSpeed, config.baseSpeed) * dpr,
            vy: rand(-config.baseSpeed, config.baseSpeed) * dpr,
          });
        }
      }

      function step() {
        ctx.clearRect(0, 0, width, height);

        // Move
        for (const n of nodes) {
          n.x += n.vx;
          n.y += n.vy;

          // soft wrap
          if (n.x < -50) n.x = width + 50;
          if (n.x > width + 50) n.x = -50;
          if (n.y < -50) n.y = height + 50;
          if (n.y > height + 50) n.y = -50;
        }

        // Links
        ctx.lineWidth = 1 * dpr;
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          for (let j = i + 1; j < nodes.length; j++) {
            const b = nodes[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.hypot(dx, dy);
            if (dist < config.linkDist * dpr) {
              const alpha = (1 - dist / (config.linkDist * dpr)) * config.linkAlpha;
              ctx.strokeStyle = "rgba(58, 168, 255," + alpha + ")";
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        // Nodes
        ctx.fillStyle = "rgba(0, 255, 213, 0.25)";
        for (const n of nodes) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, config.nodeSize * dpr, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(step);
      }

      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      function start() {
        resize();
        init();
        if (!prefersReduced) step();
      }

      window.addEventListener("resize", () => {
        resize();
        init();
      }, { passive: true });

      start();
    })();
  </script>
</body>
</html>
