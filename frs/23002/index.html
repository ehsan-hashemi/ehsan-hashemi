<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ehsan Programming Group</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html,body{
      margin:0; padding:0; height:100%; width:100%;
      overflow:hidden; /* no scroll */
      font-family:"Poppins",sans-serif;
      color:#fff;
      background:#0a0b18;
    }
    #bg{ position:fixed; inset:0; z-index:-1; }
    .container{
      height:100%; width:100%;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center;
      gap:25px;
    }
    .brand{
      display:flex; flex-direction:column; align-items:center; gap:12px;
    }
    .brand img{
      width:80px; height:80px; border-radius:16px;
    }
    .brand h1{
      font-size:clamp(1.2rem, 4vw, 2rem);
      font-weight:700;
      background:linear-gradient(135deg,#7c5cff,#29d3b0);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin:0;
      white-space:nowrap;
    }
    .card-frame{
      width:85%; max-width:720px;
      aspect-ratio:3/2;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,0.6);
      border:2px solid rgba(255,255,255,0.2);
      background:#111;
      cursor:zoom-in;
      transition:transform .3s ease;
    }
    .card-frame:hover{ transform:scale(1.02); }
    .card-frame img{
      width:100%; height:100%;
      object-fit:cover;
      display:block;
      pointer-events:none; /* disable drag */
      user-select:none;
    }
    footer{
      margin-top:20px; font-size:0.8rem; color:#aaa;
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div id="bg"></div>

  <div class="container">
    <div class="brand">
      <img src="/icon.jpeg" alt="Logo">
      <h1>Ehsan Programming Group</h1>
    </div>
    <div class="card-frame">
      <img src="./ehsanpg_frs_23002.png" alt="Membership Card" id="card">
    </div>
    <footer>© Ehsan Programming Group</footer>
  </div>

  <!-- Particles.js background -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("bg",{
      "particles":{"number":{"value":90},"color":{"value":"#7c5cff"},
      "shape":{"type":"circle"},"opacity":{"value":0.5},
      "size":{"value":3},"line_linked":{"enable":true,"color":"#29d3b0"},
      "move":{"enable":true,"speed":2}}
    });
  </script>

  <!-- Medium Zoom for image -->
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.0.8/dist/medium-zoom.min.js"></script>
  <script>
    mediumZoom('#card',{ background:'rgba(0,0,0,0.95)' });
  </script>

  <!-- Disable right-click -->
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
