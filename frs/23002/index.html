<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ehsan Programming Group</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1:#0f1020;
      --bg2:#1a1b2e;
      --accent:#7c5cff;
      --accent2:#29d3b0;
      --text:#f5f6fa;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body {
      font-family:"Poppins", sans-serif;
      background:
        radial-gradient(1000px 600px at 20% 20%, #1a1d3a 0%, transparent 60%),
        radial-gradient(800px 500px at 80% 10%, #172a33 0%, transparent 60%),
        linear-gradient(120deg, var(--bg1), var(--bg2));
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }
    h1 {
      font-weight:700;
      font-size:2rem;
      margin-bottom:30px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-align:center;
    }
    .card-frame {
      width:100%;
      max-width:720px;
      aspect-ratio:3/2;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,0.45);
      border:2px solid rgba(255,255,255,0.15);
      background:#0a0b18;
      position:relative;
    }
    .card-frame img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    footer {
      margin-top:30px;
      font-size:0.85rem;
      color:#aaa;
    }
  </style>
</head>
<body>
  <h1>Ehsan Programming Group</h1>
  <div class="card-frame">
    <img src="./ehsanpg_frs_230002.png" alt="Membership Card">
  </div>
  <footer>© Ehsan Programming Group</footer>
</body>
</html>
